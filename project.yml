name: DuckLakeExplorer
options:
  bundleIdPrefix: com.moomoomoo
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

# Regenerate the .xcodeproj (which is gitignored) with `xcodegen generate`.
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Local dev signs ad-hoc so no Apple Team is required to build/run.
    # M5 switches to Developer ID + hardened runtime + notarization.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  DuckLakeCore:
    path: .

targets:
  DuckLakeExplorer:
    type: application
    platform: macOS
    sources:
      - Sources/App
    dependencies:
      - package: DuckLakeCore
        product: DuckDBKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moomoomoo.DuckLakeExplorer
        PRODUCT_NAME: DuckLake Explorer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        # libduckdb is linked from Homebrew (absolute install name) for now.
        LIBRARY_SEARCH_PATHS:
          - "/opt/homebrew/opt/duckdb/lib"
        LD_RUNPATH_SEARCH_PATHS:
          - "/opt/homebrew/opt/duckdb/lib"
