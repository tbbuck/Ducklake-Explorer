name: CI

# Build + engine tests on every push to main and every PR. No signing here — that's the
# release workflow's job.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # macos-26 (Apple Silicon): matches our macOS 26 deployment target + Xcode 26, so the OS
    # frameworks line up with the toolchain. Building on macos-15 crashed actool compiling the
    # asset catalog with a CoreMedia/AVFCore "missing from root that overrides" skew. arm64 →
    # Homebrew at /opt/homebrew, matching Package.swift's link path.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install build tools + DuckDB
        run: brew install xcodegen duckdb

      - name: Engine tests (DuckDBKit)
        run: swift test

      - name: Build app (Release, unsigned)
        run: |
          xcodegen generate
          xcodebuild \
            -project DuckLakeExplorer.xcodeproj \
            -scheme DuckLakeExplorer \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            -quiet build
